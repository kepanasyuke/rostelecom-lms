<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ростелеком — Корпоративная ЛМС</title>
  <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="/static/img/favicon-32.png" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Шапка -->
    <header class="header">
      <div class="container header__inner">
        <a href="#" class="brand" data-nav="home">
          <img class="brand__logo" src="/static/img/rt-logo.svg" alt="Логотип Ростелекома" />
          <span class="brand__subtitle">Корпоративная ЛМС</span>
        </a>
        <nav class="nav">
          <button class="nav__link" data-nav="home">Курсы</button>
          <button class="nav__link" data-nav="stats">Мои результаты</button>
          <button class="nav__link admin-only" data-nav="admin" style="display:none">Админ-панель</button>
        </nav>
        <button class="hamburger" id="btn-burger" aria-label="Меню">
          <img src="/static/img/rt-menu.svg" alt="" class="hamburger__icon" />
        </button>
        <div class="header__auth">
          <span id="user-badge" class="user-badge" style="display:none"></span>
          <button class="btn btn--outline" id="btn-logout" style="display:none">Выйти</button>
          <button class="btn btn--primary" id="btn-login">Войти
            <img src="/static/img/rt-arrow-right.svg" alt="" class="btn__arrow" />
          </button>
        </div>
      </div>
    </header>

    <!-- Герой -->
    <section class="hero" style="background-image:url('/static/img/rt-hero-kv.jpg')">
      <div class="hero__overlay"></div>
      <div class="container hero__content">
        <h1 class="hero__title">Ты влияешь<br />на ход событий</h1>
        <p class="hero__subtitle">
          Платформа обучения Ростелекома — курсы по цифровым сервисам, ИИ и развитию команды.
          Учитесь, проходите тесты и отслеживайте прогресс.
        </p>
        <div class="hero__actions">
          <button class="btn btn--accent" data-scroll="courses">Начать учиться
            <img src="/static/img/rt-arrow-right.svg" alt="" class="btn__arrow" />
          </button>
        </div>
      </div>
    </section>

    <!-- Контент -->
    <main class="container main">
      <section id="view-home" class="view">
        <h2 class="section-title">Каталог курсов</h2>
        <div class="search-wrap">
          <img src="/static/img/rt-search.svg" alt="" class="search-wrap__icon" />
          <input id="search" class="search" type="search" placeholder="Поиск по курсам…" />
        </div>
        <div id="courses" class="grid courses"></div>
      </section>

      <section id="view-stats" class="view" style="display:none">
        <h2 class="section-title">Мои результаты</h2>
        <div id="stats" class="stats"></div>
      </section>

      <section id="view-admin" class="view" style="display:none">
        <h2 class="section-title">Админ-панель</h2>
        <div id="admin-section"></div>
      </section>

      <section id="view-course" class="view" style="display:none">
        <a href="#" class="back" data-nav="home">
          <img src="/static/img/rt-arrow-left.svg" alt="" class="back__arrow" />К каталогу
        </a>
        <div id="course-detail"></div>
      </section>

      <section id="view-lesson" class="view" style="display:none">
        <a href="#" class="back" id="back-to-course">
          <img src="/static/img/rt-arrow-left.svg" alt="" class="back__arrow" />К курсу
        </a>
        <div id="lesson-detail"></div>
      </section>
    </main>

    <!-- Модалка входа -->
    <div class="modal" id="auth-modal">
      <div class="modal__box">
        <button class="modal__close" id="auth-close">
          <img src="/static/img/rt-close.svg" alt="Закрыть" class="modal__close-icon" />
        </button>
        <h3 id="auth-title">Вход в платформу</h3>
        <form id="auth-form">
          <label class="field">
            <span>Имя пользователя</span>
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Пароль</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <label class="field" id="name-field" style="display:none">
            <span>ФИО</span>
            <input type="text" name="full_name" autocomplete="name" />
          </label>
          <p class="form-hint" id="register-hint">
            Нет аккаунта? <a href="#" id="toggle-auth">Зарегистрироваться</a>
          </p>
          <p class="form-error" id="auth-error"></p>
          <button type="submit" class="btn btn--primary btn--block" id="auth-submit">Войти</button>
        </form>
      </div>
    </div>

    <!-- Тост -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
